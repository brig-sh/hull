# hull's single release path, the same shape brig uses.
#
# GoReleaser builds and notarizes the Go binary, assembles the archive and
# writes the changelog. vz-runner is Swift, which GoReleaser cannot build and
# cannot import in the open-source edition (the prebuilt builder is a Pro
# feature), so the release workflow builds, signs and notarizes it just before
# this runs, and it travels in the archive as an extra file.
#
# GoReleaser does not write the cask. Its cask template nests each archive's
# url under on_macos and on_arm, and hull has one arm64 archive. Homebrew 7
# loads a cask on every OS and arch, and refuses the whole tap when one of
# them has no url, as macOS on Intel would have none. The release workflow
# renders the cask with scripts/render-cask.py instead, the same way the
# channel casks are rendered.
#
# The styled DMG is gone with the old workflow: notarizing an app bundle
# inside a DMG is also Pro-only, and nobody installed that way -- the Homebrew
# cask unpacks the archive below.
version: 2

project_name: hull

env:
  # Always define it, so the ldflag template below resolves even where the
  # variable is absent (local snapshot, fork). Empty means the telemetry
  # client stays inert -- that is the dev-build default, not a failure.
  - TELEMETRY_ENDPOINT={{ if isEnvSet "TELEMETRY_ENDPOINT" }}{{ .Env.TELEMETRY_ENDPOINT }}{{ end }}

before:
  hooks:
    - go mod tidy

# The version comes from the checkout (internal/buildinfo), so a release
# needs a full clone (or it reads as a pseudo-version) and a clean tree
# (or it reads as +dirty).
builds:
  - id: hull
    main: ./cmd/hull
    binary: hull
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w
      # The Makefile bakes this in but GoReleaser builds the released binary,
      # so without it every published hull shipped with telemetry inert.
      - -X github.com/brig-sh/hull/internal/telemetry.Endpoint={{ .Env.TELEMETRY_ENDPOINT }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Developer ID signing and notarization for the Go binary. vz-runner is
# handled in the workflow because it needs the virtualization entitlement.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [hull]
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  - id: hull
    ids: [hull]
    # hull discovers vz-runner and hvi next to its own executable, so all
    # three ship together.
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Arch }}"
    formats: [tar.gz]
    files:
      # Staged by the release workflow, signed and notarized with the
      # virtualization and hypervisor entitlements respectively. Outside
      # dist/, which --clean wipes. strip_parent, or the archive carries
      # build/vz-runner and the cask's `binaries:` finds nothing to link.
      - src: build/vz-runner
        strip_parent: true
        info: {mode: 0o755}
      - src: build/hvi
        strip_parent: true
        info: {mode: 0o755}
      - README.md
      - LICENSE

# The channel tags need no git.ignore_tags entry. They sit on commits that
# are never an ancestor of main, so goreleaser never finds one as the nearest
# tag. See the publish step in .github/workflows/channel.yml.

# The version a build that is not a release carries.
#
# CHANNEL_VERSION is what the channel workflow sets: a build from main or from
# one named ref is published to the tap, and Homebrew decides there is
# something to upgrade to by the version string alone -- so two builds of a
# moving channel must not share one. A local `--snapshot` sets nothing and
# takes the usual spelling.
#
# The branches are a conditional rather than envOrDefault's second argument.
# Go evaluates a function's arguments before the call, so the default was
# computed on every build, and incpatch refused a version it could not read as
# semver even when CHANNEL_VERSION held the answer.
snapshot:
  version_template: '{{ with envOrDefault "CHANNEL_VERSION" "" }}{{ . }}{{ else }}{{ incpatch .Version }}-snapshot{{ end }}'

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  draft: true
  prerelease: auto

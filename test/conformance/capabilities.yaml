  # -- deploy / scale ---------------------------------------------------------
  - id: service.deploy
    area: deploy
    status: out-of-scope
    tier: static
    notes: >
      Swarm deploy config (replicas, placement, update/rollback, resources)
      is not honored; use 'cpus'/'mem_limit' for resources.
      Out of scope (ADR-0003): orchestration.
    test: TestConformanceStatic/service.deploy

  - id: service.scale
    area: deploy
    status: out-of-scope
    tier: static
    notes: >
      Replica scaling is not supported; one VM per service.
      Out of scope (ADR-0003): orchestration.
    test: TestConformanceStatic/service.scale

  - id: service.profiles
    area: config
    status: supported
    tier: static
    notes: >
      Profiles select the services that start. A service that declares no
      profiles always starts; a service that declares one or more starts only
      when one of them is active. Profiles are activated with the repeatable
      'compose --profile NAME' or with COMPOSE_PROFILES (comma-separated),
      and '*' activates every declared profile. 'config' renders the same set
      'up' would start. Cross-service references into a disabled service are
      still validated (a required depends_on target no active profile
      enables is an error), but a disabled service's own shape is not: the
      profile filter runs before compose-go's consistency check, so a
      disabled service's missing image, for instance, is never seen while it
      stays disabled. A depends_on target that no active profile enables is
      an error, never an automatic activation, which is docker's behavior
      too (docker reports it as "service is required by ... but is
      disabled"), and
      docker's escape hatch for it is honored: 'required: false' warns and
      drops the edge instead of failing. Profile names are not validated,
      because neither the JSON schema nor compose-go validates them, so a
      name docker accepts cannot fail here. Naming a service on the command
      line ('up SERVICE...', 'config SERVICE...') activates that service's
      own profiles and then reduces to the named services plus their
      depends_on closure, docker's WithServicesEnabled order. So a
      dependency sharing the named service's profile comes along, while a
      service that merely shares that profile and is in no closure stays
      out. The whole enabled project is
      validated before the file is narrowed to the named services, so
      naming one service does not excuse another enabled service's gated
      dependency. The selection was diffed against docker compose v5.1.1
      over a real multi-profile file and a synthetic one covering siblings,
      gated dependencies and 'required: false'; every case agreed, and no
      divergence is known. Addition,
      not a divergence: an active profile that no service declares emits a
      warning line, where docker is silent. Which services start is
      unchanged by it.
    security: >
      Selection only ever removes services from the set that boots, so an
      unrecognized or misspelled profile can never start more than the file
      declares. A profile name is only ever compared as a string and is
      never joined onto a path, so leaving names unvalidated adds no
      filesystem exposure.
    test: TestConformanceStatic/service.profiles

  # -- security / isolation ---------------------------------------------------
  - id: service.privileged

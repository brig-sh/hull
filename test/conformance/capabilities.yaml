    test: TestConformanceStatic/service.privileged

  - id: service.cap_add
    area: security
    status: unsupported
    tier: static
    notes: >
      Linux capabilities are a container concept and do not apply to a VM
      guest; ignored.
    security: >
      The guest is a VM, not a namespaced container sharing the host kernel,
      so added capabilities grant no host-level privilege.
    test: TestConformanceStatic/service.cap_add

  - id: service.cap_drop
    area: security
    status: unsupported
    tier: static
    notes: >
      Capability drops do not apply to a VM guest; ignored.
    security: >
      Dropping capabilities is a no-op here; guest-to-host isolation comes
      from the VM boundary, not the capability set.
    test: TestConformanceStatic/service.cap_drop

  - id: service.security_opt

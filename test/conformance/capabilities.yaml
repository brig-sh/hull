  # ---------------------------------------------------------------------------
  # urunc extensions (x- prefixed, keep the file compose-valid)
  # ---------------------------------------------------------------------------
  - id: ext.x-hypervisor
    area: extensions
    status: partial
    tier: static
    notes: >
      Selects the guest VMM backend per service ('vz' or 'qemu', plus the
      aliases qemu-hvf/virtualization/apple); unknown values are rejected at
      parse time. Divergence: the implemented default is 'vz' when unset,
      while the docs claim it defaults to the image annotation.
    security: >
      Chooses the hypervisor backend only; both run unprivileged with no
      entitlements and no root, so backend choice grants no extra host access.
    test: TestConformanceStatic/ext.x-hypervisor

  - id: ext.x-oneshot
    area: extensions
    status: partial
    tier: static
    notes: >
      Marks a service as a job (ADR-0007 section 1): its 'command' runs to
      completion through the guest agent, the exact exit code is recorded on
      the instance record, and the VM is stopped once the command returns.
      The marker is implied as well as declared — a service targeted by any
      dependent's 'service_completed_successfully' condition is a job too,
      and 'compose config' renders 'x-oneshot: true' for both. Divergences:
      a job REQUIRES an agent-bearing image (without /urunit-agent it cannot
      report a status, so 'up' fails loudly naming the requirement instead
      of assuming success); a job must declare a 'command', from either
      direction (x-oneshot without one, or a completion-gated dependency
      without one, is a load error); the job's VM boots a benign init
      ('/bin/sleep 86400', so the image must carry /bin/sleep on top of the
      agent) and the command runs through the agent, so the job's output
      does NOT appear in 'compose logs' — it is captured and printed only
      when the job fails, where docker would stream it like any other
      service; and a
      job is never restarted whatever its 'restart:' policy says, which
      warns at load. Marker rendering, both load errors and the
      ignored-restart warning are pinned by the static case named below;
      the exit-status behavior the extension exists for — a job exiting 0
      releasing its dependents, a non-zero one failing 'up' with the code —
      needs a booted agent-bearing guest and is proven inside
      TestConformanceRuntime/service.depends_on.
    security: >
      A job's command executes inside the guest through the agent socket in
      the store directory, at the same trust level as the service command
      itself; its captured output is printed by 'up' on failure, so anything
      the job prints (including secrets) reaches the operator's terminal and
      CI logs, and the recorded exit code persists in plaintext instance
      state under the store.
    test: TestConformanceStatic/ext.x-oneshot

  - id: ext.x-healthcheck-tcp
    area: extensions
    status: supported
    tier: runtime
    notes: >
      Bare-port or struct ({port, interval, retries, start_period}) form.
      Gates depends_on 'service_healthy'. A plain TCP connect: proves a
      listener exists, not application readiness.
    security: >
      Probes are issued by the per-project gateway through its local HTTP API
      socket over the private subnet; no probe traffic leaves the host and no
      guest exec is performed.
    test: TestConformanceRuntime/ext.x-healthcheck-tcp

  # ---------------------------------------------------------------------------
  # docker compose v2 CLI verbs
  # ---------------------------------------------------------------------------
  - id: cli.up
    area: cli
    status: partial
    tier: runtime
    notes: >
      Boots one VM per service and a per-project user-mode gateway. Always
      detached (-d accepted but ignored); re-running up on an already-up
      project errors instead of reconciling. --subnet sizes the network.
      Positional SERVICE arguments start only those services and their
      depends_on closure, and start a named service whatever its profiles
      say (TestConformanceStatic/service.profiles pins the selection rules
      through 'config', which applies them identically). Divergence:
      --no-deps is not implemented, so the closure is always included.
      The gateway it starts is also the project supervisor (ADR-0007
      section 3), so restart policies keep acting after up has returned:
      TestConformanceRuntime/cli.up is where that is proven live — a killed
      'restart: always' service returns within a bounded wait, and a service
      stopped with 'hull stop' stays stopped.
    security: >
      Runs unprivileged (no root, no vmnet entitlement). Ctrl-C during up
      tears down whatever was created, leaving no orphaned gateway. The
      gateway daemon it leaves behind can boot VMs after up has returned
      (supervision), bounded by the project's own compose file and by the
      on-disk Supervise flag that teardown clears before it stops anything.
    test: TestConformanceRuntime/cli.up

  - id: cli.down
    area: cli
    status: partial
    tier: runtime
    notes: >
      Stops and removes every project service in reverse startup order and
      terminates the gateway. Divergence: no --volumes/--rmi/-t flags.
    security: >
      Best-effort teardown removes the gateway control sockets on success, so
      no listening endpoint is left behind.
    test: TestConformanceRuntime/cli.down

  - id: cli.ps
    area: cli
    status: partial
    tier: runtime
    notes: >
      Lists the project's services with instance, status and IP.
      Divergences: no --format/-a/-q flags, no JSON output; and the status
      column is the bare instance state word, so a service that ended reads
      'stopped' where docker prints 'Exited (N)'. A recorded exit code (only
      a one-shot job has one, ADR-0007 section 2) is visible through the
      top-level 'hull ps' EXIT column and 'hull inspect', not
      here; TestConformanceRuntime/service.depends_on has a completed job to
      look at and pins both halves.
    security: none identified
    test: TestConformanceRuntime/cli.ps

  - id: cli.logs
    area: cli
    status: partial
    tier: runtime
    notes: >
      Prints per-service logs; with no argument, all services are prefixed.
      --follow (-f) is restricted to a single named service, unlike docker
      compose which can follow all.
    security: >
      Log lines are echoed verbatim with no redaction, so secrets a service
      prints to stdout appear in 'compose logs' output.
    test: TestConformanceRuntime/cli.logs

  - id: cli.config
    area: cli
    status: partial
    tier: static
    notes: >
      Validates and prints the effective config without booting VMs (the
      static-tier entrypoint; added in #56). Positional SERVICE arguments
      select the services to render, docker's selection rules: the named
      services plus their depends_on closure, with a named service's own
      profiles honored. Divergence: none of docker's config flags
      (--services, --volumes, --hash, --format, --quiet, --no-interpolate,
      --resolve-image-digests).
    security: >
      Prints normalized values with interpolation applied, so resolved
      secrets from the environment and .env reach stdout; avoid running it
      where its output is captured.
    test: TestConformanceStatic/cli.config

  - id: spec.interpolation
    area: config
    status: partial
    tier: static
    notes: >
      Substitutes over the parsed YAML scalars, docker's model: comments
      are inert and values cannot inject structure. All operator forms
      ($VAR, ${VAR}, :-/-/:?/?/:+/+, $$ escape) over process env then the
      .env beside the compose file, replaceable with --env-file; unset
      substitutes empty with a warning, :?/? fail loudly. .env values
      expand against earlier entries in the same file, and a default
      nested several levels deep resolves fully — both used to be
      documented divergences from docker under the bespoke loader; neither
      is anymore. One divergence remains: a $ before a non-variable
      character passes through literally where docker errors.
    security: >
      Interpolation reads the caller's process environment and .env files;
      resolved values (including secrets) appear in 'compose config' output
      and persist in instance state like all environment values.
    test: TestConformanceStatic/spec.interpolation

  - id: cli.start
    area: cli
    status: unsupported
    tier: static
    notes: >
      No 'compose start' subcommand; bring the project up with 'compose up'.
    test: TestConformanceStatic/cli.start

  - id: cli.stop
    area: cli
    status: unsupported
    tier: static
    notes: >
      No 'compose stop' subcommand; use 'compose down'. (Top-level
      'hull stop' targets a single instance.)
    test: TestConformanceStatic/cli.stop

  - id: cli.restart
    area: cli
    status: unsupported
    tier: static
    notes: >
      No 'compose restart' subcommand; run 'compose down' then 'compose up'.
    test: TestConformanceStatic/cli.restart

  - id: cli.pull
    area: cli
    status: unsupported
    tier: static
    notes: >
      No 'compose pull' subcommand; images are pulled during 'up'. (Top-level
      'hull pull' exists.)
    test: TestConformanceStatic/cli.pull

  - id: cli.push
    area: cli
    status: unsupported
    tier: static
    notes: >
      No 'compose push' subcommand; image publishing is out of scope.
    test: TestConformanceStatic/cli.push

  - id: cli.build
    area: cli
    status: unsupported
    tier: static
    notes: >
      No 'compose build' subcommand; building is out of scope and 'image:' is
      required.
    test: TestConformanceStatic/cli.build

  - id: cli.create
    area: cli
    status: unsupported
    tier: static
    notes: >
      No 'compose create' subcommand; 'up' both creates and starts.
    test: TestConformanceStatic/cli.create

  - id: cli.exec
    area: cli
    status: partial
    tier: runtime
    notes: >
      'compose exec [-T] [--user] [--env] [--workdir] SERVICE CMD...'
      resolves the service onto its instance and runs through the guest
      agent, allocating a tty when stdin is one (-T disables). Divergences:
      requires an agent-bearing image; no --detach, --privileged or --index
      (one VM per service, no replicas).
    security: >
      Grants interactive command execution inside the guest to anyone who
      can reach the instance's agent socket in the store directory; the
      socket is a plain unix socket protected only by file permissions.
    test: TestConformanceRuntime/cli.exec

  - id: cli.run
    area: cli
    status: unsupported
    tier: static
    notes: >
      No 'compose run' one-off subcommand. (Top-level 'hull run'
      launches a single instance.)
    test: TestConformanceStatic/cli.run

  - id: cli.kill
    area: cli
    status: unsupported
    tier: static

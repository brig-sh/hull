      rewritten against the compose file's directory only when they start
      with '.'. ':ro' is accepted but NOT enforced (mounted read-write; a
      warning is emitted); the guest path must be absolute. Anonymous
      volumes and the long syntax are rejected.
    security: >
      The host filesystem is exposed to the guest over virtiofs; read-only
      intent is not enforced, so a compromised guest can write to any bound
      host path.
    test: TestConformanceRuntime/service.volumes

  - id: service.volumes_from

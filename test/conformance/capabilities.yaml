# Compose-spec capability manifest for `hull compose`.
#
# Single source of truth for the conformance suite (ADR 0002). One entry per
# capability, covering every top-level compose-spec element, every service-
# level schema key (pinned snapshot in spec/compose-spec.json), the urunc
# extensions, and the docker compose v2 CLI verbs.
#
# Statuses reflect the implementation on `main`
# (cmd/hull/compose.go + run.go), NOT aspiration:
#   supported   - behaves per spec
#   partial     - works with a documented divergence (see notes)
#   unsupported - not honored; the binary must warn/error, never drop silently
#
# tier   - which conformance test backs the entry (static = parse/validate/
#          normalize, no VM boot; runtime = boots real VMs)
# security - MANDATORY for every supported/partial entry ("none identified"
#          is acceptable, absence is not)
# test   - the backing test: TestConformanceStatic/<id> (conformance_test.go)
#          or TestConformanceRuntime/<id> (runtime_test.go, exec_runtime_test.go,
#          oneshot_runtime_test.go). Every entry has one, and the coverage
#          guards in each tier fail when an entry or a case loses its pair.
#
# A capability whose claims span both tiers keeps ONE tier here (where its
# primary proof lives) and names the other tier's case in its notes, e.g.
# service.restart (static parsing) pointing at TestConformanceRuntime/cli.up
# for the supervision loop's live effects.

capabilities:
  # ---------------------------------------------------------------------------
  # Top-level compose-spec elements (schema .properties -- 9 keys)
  # ---------------------------------------------------------------------------
  - id: toplevel.services
    area: services
    status: supported
    tier: static
    security: >
      Each service is a separate VM with its own writable rootfs clone; the
      blast radius of a compromised service is its own guest plus whatever
      host paths and ports that service explicitly declares.
    test: TestConformanceStatic/toplevel.services

  - id: toplevel.name
    area: config
    status: unsupported
    tier: static
    notes: >
      The compose-file 'name:' key is not read. The project name comes from
      -p / COMPOSE_PROJECT_NAME / the working-directory name instead.
    test: TestConformanceStatic/toplevel.name

  - id: toplevel.version
    area: config
    status: unsupported
    tier: static
    notes: >
      The deprecated top-level 'version:' key is ignored, matching docker
      compose v2 which also ignores it.
    test: TestConformanceStatic/toplevel.version

  - id: toplevel.include
    area: config
    status: supported
    tier: static
    notes: >
      Included files are merged into the project: the short form (a path) and
      the long form (path, project_directory, env_file) both work, and an
      included file can include more files. Relative paths inside an included
      file resolve against that file's directory, or against its
      'project_directory' when the include sets one, so 'config' and 'up'
      mount the same host path. Each included file is interpolated with its
      own environment: the include's 'env_file' when given, else the .env in
      the directory that file's relative paths resolve against, which is its
      own directory unless the include set 'project_directory'; the including
      file's environment is not inherited. A single include entry that lists
      several paths merges them, later overriding earlier, docker's own
      multi-file semantics; a service declared in both the including file and
      an included one (or in two included files) field-merges the same way a
      multi-file '-f' merge would, the including/later file's fields winning
      ties — this and the path-list merge were both bespoke-loader-only
      divergences (refused outright) that compose-go resolves correctly.
      Include nests arbitrarily deep (compose-go imposes no depth cap; the
      bespoke loader's own 32-level cap is gone), and a cycle is reported as
      a cycle. Unsupported keys inside an included file warn like any other,
      with the file named.
    security: >
      An include reads any path the file names, so a compose file from
      elsewhere can pull in files from outside the project directory, exactly
      as docker compose does. What it can do with them is bounded by the same
      loader: the included services go through the same validation, and a
      volume name they declare still cannot escape the volumes root — not
      because of a urunc-side check (there is none anymore), but because
      compose-go's own JSON-schema pattern for a volume name
      ([a-zA-Z0-9._-]+) already rules out '/' and '..', and namedVolumeDir
      always joins the name onto '<project>_<name>', so traversal is
      unreachable by construction.
    test: TestConformanceStatic/toplevel.include

  - id: toplevel.networks
    area: networking
    status: unsupported
    tier: static
    notes: >
      Top-level network definitions are not honored. One flat project subnet
      is used; size it with 'compose up --subnet CIDR'.
    test: TestConformanceStatic/toplevel.networks

  - id: toplevel.volumes
    area: volumes
    status: partial
    tier: static
    notes: >
      Bare named-volume declarations are honored: each becomes a
      store-managed host directory (<store>/volumes/<project>_<name>,
      docker's naming) mounted over virtiofs, persisting across down/up
      and removed only by 'down --volumes'. Divergences: declaration
      options (driver, driver_opts, external, labels, name) warn and are
      ignored, so an 'external: true' volume IS created and IS removed by
      'down --volumes' (Docker never removes external volumes); services
      sharing a volume see host-filesystem semantics through independent
      virtiofs devices, not Docker's single-kernel page-cache coherence;
      volume identity is the directory name, so on a case-insensitive
      filesystem two names differing only in case are one volume, and a
      project/volume pair that concatenates to another project's pair
      shares its directory (Docker distinguishes both via volume labels);
      a volume directory orphaned by a failed 'up' or a moved compose file
      has no reclamation command. The declaration contract is pinned by
      the static case named below; the data lifecycle (persistence across
      down/up, removal by 'down --volumes') is proven inside
      TestConformanceRuntime/service.volumes.
    security: >
      Named volumes are plain host directories under the store: readable
      and writable by any process with store access and by every service
      that mounts them; contents persist in plaintext with no quota, and
      'down --volumes' is the only deletion path.
    test: TestConformanceStatic/toplevel.volumes

  - id: toplevel.secrets
    area: security
    status: unsupported
    tier: static
    notes: >
      Top-level secrets are not created and no secret is delivered to guests.
    security: >
      Secret sources (file/environment) are silently not provisioned; an app
      relying on a mounted secret may fall back to an insecure default.
    test: TestConformanceStatic/toplevel.secrets

  - id: toplevel.configs
    area: config
    status: unsupported
    tier: static
    notes: >
      Top-level configs are not created or mounted. Bake configuration into
      the image or supply it through a bind volume.
    test: TestConformanceStatic/toplevel.configs

  - id: toplevel.models
    area: models
    status: out-of-scope
    tier: static
    notes: >
      Top-level AI model definitions are not supported; ignored.
      Out of scope (ADR-0003): Docker-platform machinery.
    test: TestConformanceStatic/toplevel.models

  # ---------------------------------------------------------------------------
  # Service-level schema keys (schema $defs.service.properties -- 93 keys)
  # ---------------------------------------------------------------------------

  # -- core service config ----------------------------------------------------
  - id: service.image
    area: services
    status: supported
    tier: static
    security: >
      The reference is pulled by the registry client and runs as guest code;
      no digest pinning is enforced, so a mutable or typosquatted tag can
      substitute the image.
    test: TestConformanceStatic/service.image

  - id: service.command
    area: services
    status: supported
    tier: static
    security: >
      The string form is shell-word split on the host with shlex (no host
      shell is invoked) and becomes the guest process args; the only exposure
      is running the operator-chosen command inside the guest VM.
    test: TestConformanceStatic/service.command

  - id: service.container_name
    area: services
    status: partial
    tier: static
    notes: >
      sanitizeName restricts names to [a-z0-9_-]; uppercase letters and dots,
      which the spec pattern permits, are rejected with an error rather than
      silently renamed.
    security: >
      The name derives on-host state paths under the store; the [a-z0-9_-]
      restriction blocks path traversal via a crafted container_name.
    test: TestConformanceStatic/service.container_name

  - id: service.environment
    area: services
    status: supported
    tier: static
    notes: >
      Map and list (KEY=VAL) forms are both accepted and both normalize to
      a sorted KEY: VAL mapping in 'compose config' output. A bare/null key
      (map form) or a bare name with no '=' (list form) inherits the host
      process's value when one is set, and renders null/empty when it is
      not — matching docker; the bespoke loader's own divergence here
      (never inheriting) is gone under compose-go.
    security: >
      Values are passed as --env and persisted verbatim in the instance state
      JSON (CmdLine) under the store in plaintext; anyone with store read
      access can recover secrets placed in environment.
    test: TestConformanceStatic/service.environment

  - id: service.entrypoint
    area: services
    status: unsupported
    tier: static
    notes: >
      Entrypoint override is not read; the image ENTRYPOINT is used as-is. Use
      'command' to override the process arguments.
    test: TestConformanceStatic/service.entrypoint

  - id: service.env_file
    area: services
    status: supported
    tier: static
    notes: >
      String, list, and long ({path, required}) forms; dotenv format with
      comments and quoting; paths resolve against the compose file's
      directory; a missing required file fails at load. Precedence is
      docker's: 'environment' beats env_file, later files beat earlier.
    security: >
      Env-file contents are read by the host, merged into the guest
      environment, and persist in plaintext instance state like all
      environment values; 'compose config' prints them resolved.
    test: TestConformanceStatic/service.env_file

  - id: service.working_dir
    area: services
    status: unsupported
    tier: static
    notes: >
      Working-directory override is not applied; the image's WorkingDir is
      used.
    test: TestConformanceStatic/service.working_dir

  - id: service.platform
    area: services
    status: unsupported
    tier: static
    notes: >
      Target platform selection is not honored; the image's native
      architecture is used.
    test: TestConformanceStatic/service.platform

  - id: service.runtime
    area: services
    status: out-of-scope
    tier: static
    notes: >
      Container runtime selection is not applicable; the VM backend is chosen
      with the x-hypervisor extension.
      Out of scope (ADR-0003): Docker-platform machinery.
    test: TestConformanceStatic/service.runtime

  - id: service.pull_policy
    area: services
    status: unsupported
    tier: static
    notes: >
      Pull policy is not honored; the image is pulled only when absent from
      the store.
    test: TestConformanceStatic/service.pull_policy

  - id: service.pull_refresh_after
    area: services
    status: unsupported
    tier: static
    notes: >
      Time-based image refresh (pull_policy=refresh) is not honored.
    test: TestConformanceStatic/service.pull_refresh_after

  - id: service.provider
    area: services
    status: out-of-scope
    tier: static
    notes: >
      Externally managed provider services are not supported; ignored.
      Out of scope (ADR-0003): Docker-platform machinery.
    test: TestConformanceStatic/service.provider

  - id: service.build
    area: build
    status: unsupported
    tier: static
    notes: >
      Image building is out of scope; pre-build and push images ('image:' is
      required). loadComposeFile errors when a service has no image.
    test: TestConformanceStatic/service.build

  - id: service.extends
    area: config
    status: supported
    tier: static
    notes: >
      compose-go resolves 'extends' during load, before hull sees the
      project: both the short form ('extends: SERVICE', same file) and the
      long form ('extends: {file, service}', a base service in another
      file) work. Scalar and list fields the extending service declares
      (image, command, ...) win over the base's; map fields (environment)
      merge key by key, the extending service's own entries winning ties.
      An 'extends' target that does not exist is a load error naming the
      missing service.
    security: >
      An 'extends: {file: ...}' target is read like any other compose file
      hull is pointed at, from wherever the path resolves to; it goes
      through the same size cap and loud-warning walk as a directly named or
      included file (via compose-go's own "extends" load event, the same
      mechanism 'include:' uses), so an unsupported key declared only on the
      extends target does not silently vanish. Scope matches 'include:'s:
      only an extends used directly in a file passed to Load fires the
      event, so an extends inside an already-included file, or inside an
      extends target itself (an extends chain more than one file deep), is
      not separately capped or warn-walked — compose-go resolves it, but
      this package's UX layer does not see it.
    test: TestConformanceStatic/service.extends

  - id: service.annotations
    area: metadata
    status: unsupported
    tier: static
    notes: >
      OCI annotations are not applied to the guest; ignored.
    test: TestConformanceStatic/service.annotations

  - id: service.labels
    area: metadata
    status: unsupported
    tier: static
    notes: >
      Container labels are not applied; ignored.
    test: TestConformanceStatic/service.labels

  - id: service.label_file
    area: metadata
    status: unsupported
    tier: static
    notes: >
      Labels themselves are never applied to a running service, so
      label_file stays unsupported: the key still warns as unsupported.
      Behavior changed under the hood: compose-go reads and parses the
      named file during load, to resolve the service's Labels, whether or
      not hull does anything with them; a label_file that does not
      exist now fails the load with compose-go's own error, where the
      bespoke loader never looked at the file at all. Previously-optional
      decoration is now a hard requirement for the file to exist and parse.
    test: TestConformanceStatic/service.label_file

  # -- networking -------------------------------------------------------------
  - id: service.ports
    area: networking
    status: partial
    tier: runtime
    notes: >
      TCP only; [HOSTIP:]HOST:GUEST forms only (single-port, ranges and
      /udp are rejected with targeted errors). Publishing binds 127.0.0.1 by
      default rather than Docker's 0.0.0.0.
    security: >
      The default 127.0.0.1 bind is a security-positive divergence from
      Docker: a published port is reachable off-host only when an explicit
      HOSTIP prefix requests it.
    test: TestConformanceRuntime/service.ports

  - id: service.networks
    area: networking
    status: unsupported
    tier: static
    notes: >
      Per-service network attachment and configuration are not supported;
      every service sits on the single flat project subnet (see --subnet).
    test: TestConformanceStatic/service.networks

  - id: service.network_mode
    area: networking
    status: out-of-scope
    tier: static
    notes: >
      Alternate network modes (host/none/service:/container:) are not
      supported; every service is on the project subnet.
      Out of scope (ADR-0003): cross-VM namespace sharing.
    security: >
      A guest cannot join the host network namespace; 'network_mode: host'
      is inert, which is a security-positive default.
    test: TestConformanceStatic/service.network_mode

  - id: service.expose
    area: networking
    status: unsupported
    tier: static
    notes: >
      expose is a no-op: the private subnet already permits service-to-service
      traffic on any port, so nothing needs exposing. Ignored.
    test: TestConformanceStatic/service.expose

  - id: service.hostname
    area: networking
    status: unsupported
    tier: static
    notes: >
      The hostname key is ignored; hull does not set a guest hostname
      (whatever the image/kernel chooses applies). Services are still
      reachable by their compose name via the gateway.
    test: TestConformanceStatic/service.hostname

  - id: service.domainname
    area: networking
    status: unsupported
    tier: static
    notes: >
      Guest domainname is not set; ignored.
    test: TestConformanceStatic/service.domainname

  - id: service.dns
    area: networking
    status: unsupported
    tier: static
    notes: >
      Custom DNS servers are not configurable; the project gateway is the
      resolver.
    test: TestConformanceStatic/service.dns

  - id: service.dns_opt
    area: networking
    status: unsupported
    tier: static
    notes: >
      Custom DNS resolver options are not passed to the guest; ignored.
    test: TestConformanceStatic/service.dns_opt

  - id: service.dns_search
    area: networking
    status: unsupported
    tier: static
    notes: >
      Custom DNS search domains are not set; ignored.
    test: TestConformanceStatic/service.dns_search

  - id: service.extra_hosts
    area: networking
    status: unsupported
    tier: static
    notes: >
      Additional /etc/hosts entries are not injected beyond the automatic
      service-name to IP map the gateway installs.
    test: TestConformanceStatic/service.extra_hosts

  - id: service.mac_address
    area: networking
    status: unsupported
    tier: static
    notes: >
      A declared MAC is ignored; the runtime assigns a deterministic MAC per
      instance for lease-based IP capture.
    test: TestConformanceStatic/service.mac_address

  - id: service.links
    area: networking
    status: out-of-scope
    tier: static
    notes: >
      Legacy container links are superseded by name-based discovery on the
      project subnet; ignored.
      Out of scope (ADR-0003): cross-VM namespace sharing.
    test: TestConformanceStatic/service.links

  - id: service.external_links
    area: networking
    status: out-of-scope
    tier: static
    notes: >
      Links to containers started outside the project are not supported.
      Out of scope (ADR-0003): cross-VM namespace sharing.
    test: TestConformanceStatic/service.external_links

  # -- lifecycle --------------------------------------------------------------
  - id: service.depends_on
    area: lifecycle
    status: partial
    tier: runtime
    notes: >
      List and map forms are accepted. 'service_started',
      'service_healthy' and 'service_completed_successfully' are honored;
      no other condition is. 'service_healthy' requires the dependency to
      declare a healthcheck (exec form) or x-healthcheck-tcp; the exec form
      wins when both are present. 'service_completed_successfully' runs the
      dependency as a job (its command executes through the guest agent)
      and gates on exit code 0: an image without /urunit-agent cannot
      report a status, so the up fails loudly instead of assuming success.
      The gated dependency must declare a 'command' — a job with nothing to
      run cannot report anything — and a file that omits it fails at load
      (pinned by TestConformanceStatic/ext.x-oneshot). The gate reads the
      recorded exit code and nothing else: it is evaluated once, in startup
      order, and a dependency whose record carries no status is a refusal
      rather than an assumed success. 'required' is honored and defaults to
      true. 'required: false' never fails its dependent: an optional
      dependency that no active profile enables warns and its edge is
      dropped (TestConformanceStatic/service.profiles), and one that is
      enabled but never completes or never becomes healthy warns and the
      dependent starts anyway, as docker does. Divergence: the condition is checked
      only while 'up' walks the graph, so a dependency that dies later does
      not retroactively stop its dependents (docker behaves the same way).
    security: >
      A completion-gated dependency runs its command inside the guest
      through the agent socket, at the same trust level as the service
      command itself; the job's captured output is printed by 'up' when it
      fails, so anything the job wrote to stdout or stderr (including
      secrets) reaches the operator's terminal and CI logs.
    test: TestConformanceRuntime/service.depends_on

  - id: service.healthcheck
    area: lifecycle
    status: partial
    tier: runtime
    notes: >
      Exec-form probes (test as CMD / CMD-SHELL / NONE, interval, timeout,
      retries, start_period, disable) run inside the guest through the
      urunit-agent and gate depends_on 'service_healthy'. Divergences: the
      image must ship /urunit-agent (a declared healthcheck that cannot run
      fails 'up' loudly instead of passing); health state is only evaluated
      while 'up' waits on a dependency, not continuously; when both
      healthcheck and x-healthcheck-tcp are declared the exec form wins.
    security: >
      Probe commands execute inside the guest as the image's configured
      user (root when unset) via the agent socket, and their output is
      captured to the host process; a malicious compose file can run
      arbitrary commands in the guest it defines, which is the same trust
      level as the service command itself.
    test: TestConformanceRuntime/service.healthcheck

  - id: service.restart
    area: lifecycle
    status: partial
    tier: static
    notes: >
      'no | always | on-failure[:N] | unless-stopped' are parsed, validated
      (an unknown value, and a non-numeric ':N', are load errors naming the
      accepted set) and honored by the per-project supervisor inside the
      gateway daemon, which polls instance liveness and re-runs a service
      that disappeared with capped exponential backoff. 'compose config'
      renders the policy as declared, not the mode it degrades to, and
      renders nothing when the file declared nothing. Divergences (ADR-0007
      section 3): a restart is noticed within the poll interval, not
      instantly; 'on-failure' degrades to 'always' with a load-time warning,
      because no exit code is observable for a plain service, so a clean
      exit cannot be told from a failure (the ':N' attempt cap is still
      honored); an explicit 'hull stop' outranks EVERY policy through
      the StoppedByUser marker (ADR-0007 section 2), so 'always' and
      'unless-stopped' are indistinguishable here and both behave like
      docker's 'unless-stopped' — docker's 'always' would bring a manually
      stopped container back when the daemon restarts, this supervisor never
      does; and a one-shot service (job) is never restarted whatever its
      policy says, which warns at load. A restarted service is re-run alone,
      so its depends_on gates are not re-evaluated and it can come back
      while a dependency is down (docker behaves the same way). Enforcement
      needs the project's gateway daemon: a hand-started gateway without
      --project parses the policy and supervises nothing. Parsing,
      validation, the degrade warning and rendering are pinned by the static
      case named below; the supervision loop's own effects — a killed
      service returning, a stopped one staying stopped — need a booted
      project and are proven inside TestConformanceRuntime/cli.up.
    security: >
      A restart re-runs the service from the project's own persisted state and
      compose file, as the user that ran 'up', with the service's CURRENT
      definition: the supervisor re-reads the compose file each poll, so a
      file edited after 'up' takes effect on the next restart, while the
      gateway's port forwards stay as 'up' set them (a service given a new
      port comes back unreachable). It grants no privilege the first start
      did not have. Restart storms are bounded by the capped exponential backoff, so a
      crash-looping guest cannot be used to spin host resources. The
      supervisor refuses to start anything once the project's supervision flag
      is cleared or its state is removed, so teardown cannot be undone by a
      daemon that outlives it.
    test: TestConformanceStatic/service.restart

  - id: service.stop_grace_period
    area: lifecycle
    status: unsupported
    tier: static
    notes: >
      Per-service stop grace is not read; the runtime uses a fixed
      SIGTERM-then-SIGKILL grace (run --stop-grace, default 10s).
    test: TestConformanceStatic/service.stop_grace_period

  - id: service.stop_signal
    area: lifecycle
    status: unsupported
    tier: static
    notes: >
      Custom stop signal is not configurable; SIGTERM is sent to the VM
      supervisor.
    test: TestConformanceStatic/service.stop_signal

  - id: service.pre_start
    area: lifecycle
    status: unsupported
    tier: static
    notes: >
      pre_start init containers are not executed; the compose layer does
      not drive the instance-level exec facility for lifecycle hooks yet.
    test: TestConformanceStatic/service.pre_start

  - id: service.post_start
    area: lifecycle
    status: partial
    tier: runtime
    notes: >
      Runs after the service starts, through the guest agent (command,
      user, environment). Divergences: requires an agent-bearing image; a
      failed hook fails 'up' and tears the project down; privileged and
      working_dir are not honored and warn.
    security: >
      Hook commands execute inside the guest with the requested user (the
      image's user when unset); same trust level as the service command.
    test: TestConformanceRuntime/service.post_start

  - id: service.pre_stop
    area: lifecycle
    status: partial
    tier: runtime
    notes: >
      Runs before each service stops during 'compose down', through the
      guest agent (command, user, environment). Divergences: requires an
      agent-bearing image; a failed or unreachable hook warns and the stop
      proceeds (down must always work); requires the original compose file
      to still exist at its recorded path.
    security: >
      Hook commands execute inside the guest with the requested user (the
      image's user when unset); same trust level as the service command.
    test: TestConformanceRuntime/service.pre_stop

  - id: service.init
    area: lifecycle
    status: unsupported
    tier: static
    notes: >
      Init-process injection is not applicable; urunit runs as PID 1 in the
      guest.
    test: TestConformanceStatic/service.init

  - id: service.stdin_open
    area: lifecycle
    status: unsupported
    tier: static
    notes: >
      Interactive stdin is not modeled; up is always detached.
    test: TestConformanceStatic/service.stdin_open

  - id: service.tty
    area: lifecycle
    status: unsupported
    tier: static
    notes: >
      PTY allocation is not modeled; ignored.
    test: TestConformanceStatic/service.tty

  - id: service.attach
    area: lifecycle
    status: unsupported
    tier: static
    notes: >
      stdio attach is not modeled; up runs detached. Use 'compose logs'.
    test: TestConformanceStatic/service.attach

  - id: service.logging
    area: lifecycle
    status: unsupported
    tier: static
    notes: >
      Logging drivers are not configurable; output goes to a per-instance log
      file read by 'compose logs'.
    test: TestConformanceStatic/service.logging

  - id: service.develop
    area: develop
    status: unsupported
    tier: static
    notes: >
      Watch/develop mode is not implemented; ignored.
    test: TestConformanceStatic/service.develop

  # -- resources --------------------------------------------------------------
  - id: service.mem_limit
    area: resources
    status: partial
    tier: static
    notes: >
      m/mb, g/gb, k/kb and b suffixes, and plain byte counts, are all
      accepted (compose-go's unit vocabulary is wider than the bespoke
      parser's, which rejected k/b as "too small"). 'compose config' renders
      a byte count as a quoted string (e.g. 1g renders "1073741824"), not a
      normalized "<N>m" value. The value that reaches the VM backend is
      bytes / 1048576, floor division, and 'config' renders that same
      floored amount so the two cannot drift: a declared 3670016 (3.5 MiB)
      renders "3145728", the 3 MB the VM actually gets. A value under 1 MiB
      would floor to 0, so 'validateProject' rejects it at load/validate
      time instead, naming the service and the byte value.
    security: >
      A mem_limit under 1 MiB is rejected before it ever reaches the run

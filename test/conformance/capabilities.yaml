  - id: cli.top
    area: cli
    status: partial
    tier: runtime
    notes: >
      'compose top [SERVICE...]' lists guest processes by running /bin/ps
      through the agent. Divergences: requires an agent-bearing image with
      /bin/ps; output is the guest's ps format, not docker's UID/PID table.
    security: >
      Process listings can reveal command-line secrets of guest processes
      to anyone able to invoke the CLI against the store.
    test: TestConformanceRuntime/cli.top


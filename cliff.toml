# git-cliff configuration for hull.
#
# CHANGELOG.md is generated from the Conventional-Commits history on main.
# PRs are rebase-merged, so every commit lands as its own entry; a subject
# that carries a "(#NN)" gets a PR link, the rest stand on their own.
#
# Local use:   scripts/changelog.sh            # rewrite CHANGELOG.md
#              scripts/changelog.sh --notes vX  # print notes for one tag
#              git-cliff --config cliff.toml -o CHANGELOG.md   # no docker
# Nothing in CI runs it: the release workflow takes its notes from GitHub
# (goreleaser `changelog.use: github`), so regenerate and commit this file
# by hand when cutting a release.

[changelog]
header = """
# Changelog

All notable changes to hull. Generated from the Conventional-Commits
history with git-cliff (`scripts/changelog.sh`); the release workflow does
not regenerate it, so run the script and commit the result when cutting a
release. History before v0.1.0-rc21 predates the import of this tree and
is kept below as it was generated then; v0.1.0-rc19 and rc20 were re-cut
imports of the same tree as rc21, and rc23 was a version bump only.
"""
# Grouped, Keep-a-Changelog-ish body. Curated highlights (if any) are
# prepended by the release workflow, not here.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""
# Turn a "(#NN)" in a subject into a PR link without hitting the GitHub API,
# so changelog generation needs no token.
postprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/brig-sh/hull/pull/${1}))" },
]

[git]
conventional_commits = true
# Drop commits that are not Conventional Commits (stray merges, etc.) rather
# than dumping them into a catch-all section.
filter_unconventional = true
split_commits = false
# Group by type; skip the noise (version bumps, the changelog commit itself,
# CI plumbing) so the changelog reads as user-facing change, not git chatter.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "(?i)^chore: bump VERSION", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", skip = true },
  { message = "^build", group = "Build" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"


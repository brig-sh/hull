name: Fetch hvi-vmm submodule
description: >
  Fetch the hvi-vmm submodule. It is a public repository, so the checkout
  needs no credentials; this stays a separate step, and a separate action,
  so every job that builds or boots hvi asks for the submodule the same way.

runs:
  using: composite
  steps:
    - name: Fetch the hvi-vmm submodule
      shell: bash
      # sync first: a self-hosted runner keeps its workspace between jobs, and
      # a module config that once recorded an ssh remote keeps fetching over
      # ssh (no key on the runner) however public the repository is. sync
      # re-reads the https URL from .gitmodules on every run.
      run: |
        git submodule sync -- hvi-vmm
        git submodule update --init hvi-vmm

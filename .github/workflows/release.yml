name: Release

# hull's only release path.
#
# vz-runner first, because GoReleaser cannot build a Swift binary and cannot
# import one in the open-source edition. It is signed with the virtualization
# entitlement and notarized here, then GoReleaser picks it up as an extra file
# in the archive, notarizes the Go binary and writes the changelog. For a
# stable tag the `tap` job then renders the cask and opens it against the tap
# as a pull request.
#
# Runs on our own macOS runner: swift build and codesign need a Mac. Tag
# builds only, so a fork can never reach it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true

concurrency:
  # One release at a time, in a group no other workflow joins. A group keeps
  # one pending run, and a newer pending run cancels it, so a group shared
  # with ci or the channel publish let an unrelated merge cancel a waiting
  # release. The keychain is serialised by scripts/keychain-lock.sh instead.
  # Never cancel-in-progress: cancelling mid-sign leaves the search list
  # pointing at a keychain that is gone.
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Sigstore hands out the signing certificate against this token. Without it
  # cosign finds no ambient OIDC credential and falls back to an interactive
  # device flow -- which hangs the job waiting for a browser, and would sign
  # with a personal identity rather than this workflow's, so the signature
  # would fail the very check that makes it worth having.
  id-token: write

jobs:
  release:
    name: build, sign, notarize, publish
    # notary: a runner whose egress reaches Apple's notarization service.
    # v0.1.0-rc26 failed three times with HTTPClientError.connectTimeout on
    # the mac-dev-01 runners, which cannot, while the msuch ones can.
    runs-on: [self-hosted, macOS, ARM64, notary]
    # Under keychain-lock.sh's STALE, so a lock older than that cannot belong
    # to a job that is still running.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # GoReleaser derives the version and the changelog from the tag
          # history, so a shallow clone gives it the wrong answer.
          fetch-depth: 0
          # The ref belongs HERE, on the checkout. It used to sit on the
          # setup-go step below, which has no such input and silently ignores
          # unknown ones -- so a workflow_dispatch built whatever branch it was
          # started from, and the result was signed, notarized, uploaded under
          # the typed tag and sent to the Homebrew tap. The dmg job further
          # down always had this right.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Pin the toolchain rather than inheriting whatever Go happens to be
      # installed on the runner. This job builds on a persistent self-hosted
      # Mac, so without this the released binary is compiled by whichever
      # toolchain was last set up by hand -- and that is not a hypothetical:
      # v0.1.0-rc8 shipped built with go1.26.5, carrying six standard-library
      # advisories that were already fixed in go1.26.6, while brig's releases
      # (which do pin) shipped clean from the same source tree.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true
          # These jobs run on a self-hosted runner, where GOMODCACHE and
          # GOCACHE already survive between runs. Uploading them to the
          # Actions cache service as well buys nothing and costs minutes:
          # measured on v0.1.0-rc20, "Post Run setup-go" (the cache save) took
          # 239s here and the restore in the installer job took 215s, against
          # about 110s of actual build, sign and notarize work.
          cache: false

      # hvi-vmm is a submodule and a shipped binary, so a release cannot be cut
      # without it.
      - uses: ./.github/actions/fetch-hvi-vmm

      # goreleaser checks the tree before its tidy hook runs, so a hook that
      # changes go.mod or go.sum would ship every binary as +dirty. Tidy first.
      - name: Check the tree stays clean after go mod tidy
        run: |
          set -euo pipefail
          go mod tidy
          changed="$(git status --porcelain -- go.mod go.sum)"
          [ -z "$changed" ] || {
            echo "go mod tidy changed the module files:" >&2
            echo "$changed" >&2
            exit 1; }

      # One signing job at a time on the shared Mac. See
      # scripts/keychain-lock.sh for why this is not a concurrency group. The
      # script comes from the workflow's own commit, because the tag being
      # released may predate it.
      - name: Take the keychain lock
        run: |
          git show "$GITHUB_WORKFLOW_SHA:scripts/keychain-lock.sh" \
            > "$RUNNER_TEMP/keychain-lock.sh"
          sh "$RUNNER_TEMP/keychain-lock.sh" acquire

      - name: Import the Developer ID certificate into an ephemeral keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "no Developer ID identity" >&2; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # vz-runner carries com.apple.security.virtualization and hvi carries
      # com.apple.security.hypervisor. Without a Developer ID signature macOS
      # refuses either entitlement under SIP and no VM starts, so this is not
      # optional for either. The two are handled by one function rather than
      # two copies of it: the only things that differ are the name, the
      # entitlements plist and the key that must survive signing.
      - name: Build, sign and notarize the VMMs
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          make vz_runner hvi_vmm
          # NOT dist/: goreleaser runs with --clean and wipes that directory
          # before it builds, which would delete the binaries we just signed.
          mkdir -p build
          cp vz-runner/.build/arm64-apple-macosx/release/vz-runner build/vz-runner
          cp hvi-vmm/target/release/hvi build/hvi
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"

          sign_and_notarize() {
            name=$1; entitlements=$2; required=$3
            codesign --force --options runtime --timestamp \
              --keychain "$KEYCHAIN" --sign "$IDENTITY" \
              --entitlements "$entitlements" "build/$name"
            codesign --verify --strict "build/$name"
            codesign -d --entitlements - --xml "build/$name" \
              | grep -q "$required" \
              || { echo "$name lost $required" >&2; exit 1; }

            # A bare binary cannot have a ticket stapled to it, so notarize it
            # in a zip and let Gatekeeper resolve the ticket online. Skipping
            # this is what shipped "Unnotarized Developer ID" in rc19.
            ditto -c -k "build/$name" "$RUNNER_TEMP/$name.zip"
            SUBMIT=$(xcrun notarytool submit "$RUNNER_TEMP/$name.zip" \
              --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --output-format json)
            echo "$SUBMIT"
            SUB_ID=$(printf '%s' "$SUBMIT" | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' | head -1)
            [ -n "$SUB_ID" ] || { echo "no notarization submission id" >&2; exit 1; }

            # Assert the ticket rather than probe Gatekeeper. The online lookup
            # a `codesign --test-requirement="=notarized"` performs can lag the
            # submission by hours and is unreliable on a machine with custom
            # boot-args, so it can neither pass nor fail us honestly. What Apple
            # returns here is authoritative: the ticket it issued names the
            # cdhash it covers, so comparing that to the binary we are about to
            # ship proves the artifact is the notarized one.
            xcrun notarytool log "$SUB_ID" \
              --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              > "$RUNNER_TEMP/notary-log.json"
            rm "$RUNNER_TEMP/$name.zip"
            cat "$RUNNER_TEMP/notary-log.json"

            grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary-log.json" \
              || { echo "Apple did not accept $name" >&2; exit 1; }
            TICKET=$(sed -n 's/.*"cdhash" *: *"\([^"]*\)".*/\1/p' \
              "$RUNNER_TEMP/notary-log.json" | head -1)
            ACTUAL=$(codesign -dvvv "build/$name" 2>&1 | sed -n 's/^CDHash=//p')
            [ -n "$TICKET" ] && [ "$TICKET" = "$ACTUAL" ] || {
              echo "notarized cdhash $TICKET != shipped cdhash $ACTUAL" >&2; exit 1; }
            echo "$name notarized; ticket covers cdhash $ACTUAL"
          }

          sign_and_notarize vz-runner vz-runner/Entitlements-novmnet.plist \
            com.apple.security.virtualization
          sign_and_notarize hvi hvi-vmm/hvi.entitlements \
            com.apple.security.hypervisor
          rm "$RUNNER_TEMP/notary-key.p8"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Stage the notary key for GoReleaser
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
          MACOS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          # Baked into the binary by ldflags. Unset (forks) leaves the
          # telemetry client inert rather than failing the build.
          TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}

      # The cask links `binaries: [hull, vz-runner]` by name from the archive
      # root. rc25 shipped vz-runner one directory down and the cask silently
      # linked nothing, so assert the layout and the signatures here rather
      # than discover it on someone's laptop.
      - name: Verify the archive
        run: |
          TARBALL=$(ls dist/hull-*-arm64.tar.gz)
          WORK=$(mktemp -d)
          tar xzf "$TARBALL" -C "$WORK"
          for b in hull vz-runner; do
            [ -f "$WORK/$b" ] || {
              echo "$b is not at the archive root:" >&2
              tar tzf "$TARBALL" >&2; exit 1; }
            codesign --verify --strict "$WORK/$b" \
              || { echo "$b is not validly signed" >&2; exit 1; }
            # --verbose=2, or codesign prints no Authority= lines at all and
            # the Developer ID check below fails on every well-signed binary.
            DESC=$(codesign -dv --verbose=2 "$WORK/$b" 2>&1)
            printf '%s\n' "$DESC" | grep -q "flags=.*runtime" \
              || { echo "$b is missing the hardened runtime" >&2; exit 1; }
            printf '%s\n' "$DESC" | grep -q "Authority=Developer ID Application" \
              || { echo "$b is not Developer ID signed" >&2; exit 1; }
            echo "$b: at root, Developer ID signed, hardened runtime"
          done
          rm -rf "$WORK"

      - name: Delete the ephemeral keychain
        if: always()
        run: |
          # KEYCHAIN is set only once this job holds the keychain lock and is
          # about to replace the search list. A job without it must leave the
          # list alone, or it drops the lock holder's keychain mid-sign.
          if [ -n "${KEYCHAIN:-}" ]; then
            if [ -f "$KEYCHAIN" ]; then
              security delete-keychain "$KEYCHAIN"
            fi
            # The import replaced the user's search list wholesale; put the
            # login keychain back whatever happened above.
            security list-keychains -d user -s login.keychain-db
          fi

  # The drag-to-Applications installer, built after the release exists and
  # attached to it.
  #
  # Separate from the job above because GoReleaser's open-source edition can
  # notarize bare binaries but not an app bundle inside a DMG -- that is a Pro
  # feature. Rather than keep a second release path for it, this consumes the
  # release the first job published and adds one artifact to it.
  #
  # The binaries inside the bundle are NOT the tarball's binaries: a bundle
  # seals its nested code, so they are signed again here and their hashes
  # differ by construction. The DMG is notarized and stapled as a whole, which
  # is what makes it verifiable offline -- the tarball's bare binaries can only
  # be checked online.
      - name: Release the keychain lock
        if: always()
        run: '[ ! -f "$RUNNER_TEMP/keychain-lock.sh" ] || sh "$RUNNER_TEMP/keychain-lock.sh" release'

  # The stable cask, rendered from the release the job above drafted and
  # opened against the tap as a pull request. GoReleaser does not write it;
  # see the header of .goreleaser.yaml. A release candidate leaves the tap
  # alone, so `brew upgrade` follows stable versions only.
  #
  # A job of its own, so a tap that cannot be reached does not stop the
  # installer image, and "Re-run failed jobs" retries it alone. Nothing here
  # needs a Mac.
  tap:
    name: tap pull request
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading a draft release needs write access. This job signs nothing, so
    # it does not take the workflow's id-token.
    permissions:
      contents: write
    steps:
      - name: Work out whether this tag goes to the tap
        id: tap
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in
            *-*)
              echo "stable=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is a prerelease; the tap is left alone" ;;
            *)
              echo "stable=true" >> "$GITHUB_OUTPUT" ;;
          esac

      # The workflow's own commit, for the renderer, the caveats and the tap
      # script. For a tag push that is the tag. A workflow_dispatch of an
      # older tag would otherwise run that tag's renderer, which may not know
      # the stable cask.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.tap.outputs.stable == 'true'
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: steps.tap.outputs.stable == 'true'

      # The release is still a draft, so its assets need this token. cosign
      # checks that checksums.txt is the one this workflow signed, and
      # sha256sum ties the archive to it, so the cask names the bytes the
      # release signed.
      - name: Fetch the archive and verify it against the signed checksums
        if: steps.tap.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.tap.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "v$V" -R "$GITHUB_REPOSITORY" -D dist \
            -p "hull-$V-arm64.tar.gz" \
            -p checksums.txt -p checksums.txt.sig -p checksums.txt.pem
          cd dist
          # A tag push signs as the tag. A workflow_dispatch signs as the
          # branch it ran from, which for a release is main.
          VRE="$(printf '%s' "$V" | sed 's/\./\\./g')"
          cosign verify-blob \
            --certificate checksums.txt.pem --signature checksums.txt.sig \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/(tags/v${VRE}|heads/main)\$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          sha256sum -c --ignore-missing checksums.txt

      # Minted here, after the release job: an App token lasts an hour, and
      # signing and notarizing can take most of that. continue-on-error so a
      # missing App falls back to the PAT secret below.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: tap-token
        if: steps.tap.outputs.stable == 'true'
        continue-on-error: true
        with:
          app-id: ${{ vars.NOFIRE_BOT_APP_ID }}
          private-key: ${{ secrets.NOFIRE_BOT_PRIVATE_KEY }}
          owner: brig-sh
          repositories: homebrew-brig

      # conflicts_with names both channels, because Homebrew reads only the
      # conflicts of the cask being installed. cosign checks the signature on
      # the boot bundle; without it on PATH, hull boots the bundle with a
      # warning instead.
      - name: Render the cask and open the tap pull request
        if: steps.tap.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          V: ${{ steps.tap.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "no token for the tap" >&2; exit 1; }
          python3 scripts/render-cask.py \
            --project hull --version "$V" \
            --repo brig-sh/hull --tag "v$V" --dist dist \
            --archive "on_macos:on_arm:hull-$V-arm64.tar.gz" \
            --desc "Run unikernels and sandboxed Linux containers as microVMs on Apple Silicon" \
            --caveats-file packaging/cask-caveats.txt \
            --binary hull --binary vz-runner --binary hvi \
            --depends-formula cosign \
            --conflicts-with main --conflicts-with experimental \
            --out "$RUNNER_TEMP/hull.rb"
          cat "$RUNNER_TEMP/hull.rb"
          bash scripts/open-tap-pr.sh brig-sh/homebrew-brig "$V" "$RUNNER_TEMP/hull.rb"

  dmg:
    name: installer image
    needs: release
    # create-dmg lays the installer window out by driving Finder over
    # AppleScript, and Finder only answers inside a logged-in console (Aqua)
    # session. A runner whose agent runs as a daemon or over ssh has none, and
    # there osascript fails with "An error of type -10810 has occurred". The
    # sip-enabled runner is set up that way, and with three runners sharing
    # the bare macOS labels this job drew it for rc23 and rc24 both, failing
    # each time until a rerun happened to land on a msuch Mac. So this job
    # asks for the `gui` label, which only the runners with a console session
    # carry, and the first step checks the claim rather than trusting the
    # label: a runner re-registered without a session would otherwise fail
    # twenty minutes in, at the dmg, instead of at once.
    runs-on: [self-hosted, macOS, ARM64, gui]
    # Under keychain-lock.sh's STALE, so a lock older than that cannot belong
    # to a job that is still running.
    timeout-minutes: 75
    steps:
      - name: Assert a console session, which Finder needs
        run: |
          [ "$(launchctl managername)" = Aqua ] || {
            echo "this runner has no Aqua session ($(launchctl managername)); create-dmg cannot drive Finder here" >&2
            exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Same reason as the release job: this one builds hull for the app
      # bundle, so it must not inherit the runner's ambient toolchain either.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true
          # Same reason as the release job above: the Go caches persist on this
          # runner, so the Actions cache round-trip is pure overhead.
          cache: false

      # The app bundle carries hvi, so this job builds it too and needs the
      # submodule for the same reason the release job does.
      - uses: ./.github/actions/fetch-hvi-vmm

      - name: Install create-dmg
        run: test -x "$(brew --prefix)/bin/create-dmg" || brew install create-dmg

      # One signing job at a time on the shared Mac. See
      # scripts/keychain-lock.sh for why this is not a concurrency group. The
      # script comes from the workflow's own commit, because the tag being
      # released may predate it.
      - name: Take the keychain lock
        run: |
          git show "$GITHUB_WORKFLOW_SHA:scripts/keychain-lock.sh" \
            > "$RUNNER_TEMP/keychain-lock.sh"
          sh "$RUNNER_TEMP/keychain-lock.sh" acquire

      - name: Import the Developer ID certificate into an ephemeral keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN="$RUNNER_TEMP/dmg.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "no Developer ID identity" >&2; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the signed app bundle and installer image
        run: make dmg_image CODESIGN_IDENTITY="$IDENTITY" CODESIGN_KEYCHAIN="$KEYCHAIN"

      - name: Notarize, staple and verify
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          xcrun notarytool submit dist/hull.dmg \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          rm "$RUNNER_TEMP/notary-key.p8"
          # Stapling is the point of shipping a DMG at all: the ticket travels
          # with the file, so it verifies with no network.
          xcrun stapler staple dist/hull.dmg
          xcrun stapler validate dist/hull.dmg
          spctl -a -vv -t open --context context:primary-signature dist/hull.dmg

      # The DMG is built after goreleaser has already produced and signed
      # checksums.txt, so it appears in neither -- notarized and stapled, which
      # is a real control, but with nothing tying it to this repository's
      # release. Combined with --clobber below, it could be replaced later and
      # no signed manifest would disagree. So sign the artifact itself.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the DMG
        run: |
          cosign sign-blob --yes \
            --output-signature dist/hull.dmg.sig \
            --output-certificate dist/hull.dmg.pem \
            dist/hull.dmg

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          gh release upload "$TAG" \
            dist/hull.dmg dist/hull.dmg.sig dist/hull.dmg.pem \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Delete the ephemeral keychain
        if: always()
        run: |
          # KEYCHAIN is set only once this job holds the keychain lock and is
          # about to replace the search list. A job without it must leave the
          # list alone, or it drops the lock holder's keychain mid-sign.
          if [ -n "${KEYCHAIN:-}" ]; then
            if [ -f "$KEYCHAIN" ]; then
              security delete-keychain "$KEYCHAIN"
            fi
            security list-keychains -d user -s login.keychain-db
          fi
      - name: Release the keychain lock
        if: always()
        run: '[ ! -f "$RUNNER_TEMP/keychain-lock.sh" ] || sh "$RUNNER_TEMP/keychain-lock.sh" release'

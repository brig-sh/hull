# The prerelease channels: a build people can install and try before there is
# a release, or a release candidate, to try.
#
# Two of them, kept separate rather than one channel with two sources.
#
#   main          follows the tip of main, republished on every merge.
#   experimental  is promoted by hand from any ref, which is how an unmerged
#                 branch reaches a tester.
#
# brig has the same pair, and a feature usually spans both repositories, so
# brig@main depends on hull@main and brig@experimental on hull@experimental.
#
# This runs the same build, sign and notarize steps the release does, on the
# same runner, because a channel build has to be installable: vz-runner and
# hvi carry the virtualization and hypervisor entitlements, and macOS refuses
# either without a Developer ID signature. The two signing steps below are
# copied from release.yml rather than shared. Factoring them into a composite
# action is the right end state and is deliberately not done here: it would
# edit the release path to add a channel, and that path is not one to change
# blind. See the note in docs/releasing.md.
name: channel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to publish to the experimental channel"
        required: true

permissions:
  contents: write

concurrency:
  # One publish per channel at a time. Two racing runs would move the same tag
  # and leave the tap's cask naming assets the release no longer has.
  group: channel-${{ github.event_name == 'workflow_dispatch' && 'experimental' || 'main' }}
  cancel-in-progress: false

jobs:
  publish:
    name: build, sign, notarize, publish a channel
    # Every self-hosted runner here is the same physical Mac, and this job
    # rewrites the user keychain search list exactly as ci and release do.
    # The workflow-level group above keeps two publishes of one channel apart;
    # it does nothing about this job racing ci's signing jobs, which a push to
    # main starts at the same moment. So join the group those two use. Never
    # cancel-in-progress: cancelling mid-sign leaves the search list pointing
    # at a keychain that is gone.
    concurrency:
      group: macos-signing-shared-mac
      cancel-in-progress: false
    # notary: a runner whose egress reaches Apple's notarization service.
    runs-on: [self-hosted, macOS, ARM64, notary]
    steps:
      # The dispatch input reaches bash through the environment, never through
      # a ${{ }} substitution: an expression is pasted into the script before
      # bash reads it, so a ref carrying a quote or a $(...) would run as
      # shell on a self-hosted runner holding a signing certificate. It is
      # also checked against what a ref can contain, because the same value
      # ends up inside a Ruby string in the cask.
      - name: Work out which channel this is
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event.inputs.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$REF" in
              *[!A-Za-z0-9._/-]*|"")
                echo "$REF is not a branch, tag or SHA" >&2; exit 1;;
            esac
            {
              echo "name=experimental"
              echo "ref=$REF"
              echo "source=$REF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "name=main"
              echo "ref=$SHA"
              echo "source=the tip of main"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.channel.outputs.ref }}
          submodules: recursive
          # goreleaser reads the tag history to derive the version this build
          # is the successor to, so a shallow clone gives it the wrong answer.
          fetch-depth: 0
          # An experimental build checks out a ref somebody asked for, and
          # this job can write to the repository and holds a signing
          # certificate. The default checkout leaves its token in the git
          # config, where anything that ref runs could reach it. The tag push
          # below is given a token explicitly instead.
          persist-credentials: false

      # The workflow's own commit, kept apart from the ref being built. The
      # renderer and the goreleaser config are run from here, so promoting a
      # branch does not mean running that branch's copy of either.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          persist-credentials: false

      # The version a channel build carries. Homebrew decides there is
      # something to upgrade to from the version string alone, so two builds
      # of a moving channel must never share one.
      - name: Compose the version
        id: version
        run: |
          set -euo pipefail
          BASE="$(cat VERSION)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "value=${BASE}-${{ steps.channel.outputs.name }}.$(date -u +%Y%m%d).${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      # goreleaser checks the tree before its hooks run, so its `go mod tidy`
      # hook could change go.mod or go.sum afterwards and nothing would fail:
      # a snapshot build does not refuse a dirty tree. Tidy here first and
      # stop on any change, then skip the hooks below.
      - name: Check the tree stays clean after go mod tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Import the Developer ID certificate into an ephemeral keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "no Developer ID identity" >&2; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # vz-runner carries com.apple.security.virtualization and hvi carries
      # com.apple.security.hypervisor. Without a Developer ID signature macOS
      # refuses either entitlement under SIP and no VM starts, so this is not
      # optional for either. The two are handled by one function rather than
      # two copies of it: the only things that differ are the name, the
      # entitlements plist and the key that must survive signing.
      - name: Build, sign and notarize the VMMs
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          make vz_runner hvi_vmm
          # NOT dist/: goreleaser runs with --clean and wipes that directory
          # before it builds, which would delete the binaries we just signed.
          mkdir -p build
          cp vz-runner/.build/arm64-apple-macosx/release/vz-runner build/vz-runner
          cp hvi-vmm/target/release/hvi build/hvi
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"

          sign_and_notarize() {
            name=$1; entitlements=$2; required=$3
            codesign --force --options runtime --timestamp \
              --keychain "$KEYCHAIN" --sign "$IDENTITY" \
              --entitlements "$entitlements" "build/$name"
            codesign --verify --strict "build/$name"
            codesign -d --entitlements - --xml "build/$name" \
              | grep -q "$required" \
              || { echo "$name lost $required" >&2; exit 1; }

            # A bare binary cannot have a ticket stapled to it, so notarize it
            # in a zip and let Gatekeeper resolve the ticket online. Skipping
            # this is what shipped "Unnotarized Developer ID" in rc19.
            ditto -c -k "build/$name" "$RUNNER_TEMP/$name.zip"
            SUBMIT=$(xcrun notarytool submit "$RUNNER_TEMP/$name.zip" \
              --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --output-format json)
            echo "$SUBMIT"
            SUB_ID=$(printf '%s' "$SUBMIT" | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' | head -1)
            [ -n "$SUB_ID" ] || { echo "no notarization submission id" >&2; exit 1; }

            # Assert the ticket rather than probe Gatekeeper. The online lookup
            # a `codesign --test-requirement="=notarized"` performs can lag the
            # submission by hours and is unreliable on a machine with custom
            # boot-args, so it can neither pass nor fail us honestly. What Apple
            # returns here is authoritative: the ticket it issued names the
            # cdhash it covers, so comparing that to the binary we are about to
            # ship proves the artifact is the notarized one.
            xcrun notarytool log "$SUB_ID" \
              --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              > "$RUNNER_TEMP/notary-log.json"
            rm "$RUNNER_TEMP/$name.zip"
            cat "$RUNNER_TEMP/notary-log.json"

            grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary-log.json" \
              || { echo "Apple did not accept $name" >&2; exit 1; }
            TICKET=$(sed -n 's/.*"cdhash" *: *"\([^"]*\)".*/\1/p' \
              "$RUNNER_TEMP/notary-log.json" | head -1)
            ACTUAL=$(codesign -dvvv "build/$name" 2>&1 | sed -n 's/^CDHash=//p')
            [ -n "$TICKET" ] && [ "$TICKET" = "$ACTUAL" ] || {
              echo "notarized cdhash $TICKET != shipped cdhash $ACTUAL" >&2; exit 1; }
            echo "$name notarized; ticket covers cdhash $ACTUAL"
          }

          sign_and_notarize vz-runner vz-runner/Entitlements-novmnet.plist \
            com.apple.security.virtualization
          sign_and_notarize hvi hvi-vmm/hvi.entitlements \
            com.apple.security.hypervisor
          rm "$RUNNER_TEMP/notary-key.p8"

      - name: Stage the notary key for GoReleaser
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"

      # --snapshot builds the archive and publishes nothing. The Go binary is
      # still signed and notarized: the channel cask installs it, and an
      # unnotarized binary is one Gatekeeper stops on the tester's machine,
      # which would defeat the point of shipping a channel at all.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=before,sbom --config .workflow/.goreleaser.yaml
        env:
          CHANNEL_VERSION: ${{ steps.version.outputs.value }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
          MACOS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}

      # The cask links the three binaries by name from the archive root. rc25
      # shipped vz-runner one directory down and the cask silently linked
      # nothing, so assert the layout here rather than discover it on
      # somebody's laptop.
      - name: Verify the archive
        env:
          V: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          TARBALL="dist/hull-$V-arm64.tar.gz"
          [ -f "$TARBALL" ] || { echo "$TARBALL was not built" >&2; exit 1; }
          for binary in hull vz-runner hvi; do
            tar -tzf "$TARBALL" | grep -qx "$binary" \
              || { echo "$binary is not at the archive root" >&2; exit 1; }
          done

      # Moved rather than created. A channel is one release whose assets are
      # replaced, so a year of merges leaves one tag and one release.
      # The new assets go up before anything else changes. The cask in the tap
      # still names the previous build's files at this point, and those files
      # are still there -- so an install during this step gets the old build
      # rather than a 404, and the tap's checksum CI still agrees with itself.
      # The old assets are removed after the tap has moved on; see below.
      - name: Publish to the channel release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: channel-${{ steps.channel.outputs.name }}
          SOURCE: ${{ steps.channel.outputs.source }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          set -euo pipefail
          NOTES="Built from $SOURCE at $(git rev-parse --short HEAD). Not a release."
          TITLE="$CHANNEL channel"
          git tag -f "$TAG"
          # The checkout persisted no credentials, so the push is given one.
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --target "$(git rev-parse HEAD)" \
              --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --target "$(git rev-parse HEAD)" \
              --title "$TITLE" --notes "$NOTES"
          fi
          # checksums.txt as well as the archives: the tap's CI asks each
          # release whether it really published the sha256 its cask claims,
          # and a channel cask has to answer that the same way a stable one
          # does.
          gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber

      # The import replaced the user's search list wholesale, and this runner
      # is not disposable. Without this the default search list keeps naming
      # an ephemeral keychain that auto-locks and is deleted at the next job,
      # and the next thing to read it fails with errSecInternalComponent.
      # release.yml treats the same step as mandatory.
      - name: Delete the ephemeral keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
          security list-keychains -d user -s login.keychain-db

      - name: Render the cask
        env:
          V: ${{ steps.version.outputs.value }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          SOURCE: ${{ steps.channel.outputs.source }}
        run: |
          set -euo pipefail
          OTHER=experimental
          [ "$CHANNEL" = "experimental" ] && OTHER=main
          python3 .workflow/scripts/render-cask.py \
            --project hull --channel "$CHANNEL" --version "$V" \
            --repo brig-sh/hull --tag "channel-$CHANNEL" --dist dist \
            --archive "on_macos:on_arm:hull-$V-arm64.tar.gz" \
            --desc "Run unikernels and sandboxed Linux containers as microVMs on Apple Silicon" \
            --source "$SOURCE" \
            --binary hull --binary vz-runner --binary hvi \
            --depends-arch arm64 --depends-formula cosign \
            --conflicts-with "$OTHER" \
            --out "hull@$CHANNEL.rb"

      # Pushed rather than opened as a pull request, unlike the stable cask:
      # a channel cask is regenerated on every merge, and a PR per merge is
      # noise nobody reads.
      - name: Update the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          V: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/tap"
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/brig-sh/homebrew-brig.git" "$RUNNER_TEMP/tap"
          cp "hull@$CHANNEL.rb" "$RUNNER_TEMP/tap/Casks/hull@$CHANNEL.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "brig-sh-bot"
          git config user.email "bot@brig.sh"
          git add "Casks/hull@$CHANNEL.rb"
          git diff --cached --quiet && { echo "the cask is unchanged"; exit 0; }
          git commit -m "chore(cask): hull@$CHANNEL $V"
          # Rebased and retried rather than pushed once. brig and hull each
          # publish two channels into this one repository, and nothing
          # serializes across the four: a concurrency group is per workflow,
          # and these are four workflows in two repositories. Two that overlap
          # would have the loser rejected non-fast-forward, its channel left
          # stale, and the error pointing at git rather than at the cause.
          # They touch different files, so a rebase always applies.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "the tap moved under this push; rebasing (attempt $attempt)"
            git pull --rebase --quiet origin main
            sleep $((attempt * 2))
          done
          echo "the tap could not be updated after five attempts" >&2
          exit 1

      # Only now, with the tap naming the new files, are the previous build's
      # assets removed. They carry that build's version in their name, so
      # --clobber never replaced them and the release would otherwise list
      # every build ever made. Doing it before the tap moved is what would
      # give an installer a 404 -- see the note on the upload above.
      - name: Remove the assets no cask names any more
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: channel-${{ steps.channel.outputs.name }}
        run: |
          set -euo pipefail
          keep="$(cd dist && ls -- *.tar.gz checksums.txt)"
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r asset; do
            [ -n "$asset" ] || continue
            printf '%s\n' "$keep" | grep -qxF "$asset" && continue
            echo "removing the stale asset $asset"
            gh release delete-asset "$TAG" "$asset" --yes
          done
